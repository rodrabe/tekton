apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: generate-sbom
spec:
  params:
    - name: image-name
      type: string
      description: The Packer image name produced by task 1
    - name: message
      type: string
      description: The original message string
    - name: character-count
      type: string
      description: Character count from task 1
  results:
    - name: sbom-summary
      description: Summary of the SBOM (count of packages, etc.)
  steps:
    - name: generate-sbom
      image: alpine:3.18
      script: |
        #!/bin/sh
        set -euo pipefail
        
        IMAGE_NAME="$(params.image-name)"
        TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        
        echo "==> Generating SBOM for image: ${IMAGE_NAME}"
        echo "==> Timestamp: ${TIMESTAMP}"
        
        cat > /tmp/sbom.json << 'SBOMEOF'
        {
          "bomFormat": "CycloneDX",
          "specVersion": "1.4",
          "version": 1,
          "metadata": {
            "timestamp": "TIMESTAMP_PLACEHOLDER",
            "component": {
              "type": "application",
              "name": "IMAGE_NAME_PLACEHOLDER",
              "version": "1.0.0"
            }
          },
          "components": [
            {"type": "library", "name": "curl", "version": "7.81.0"},
            {"type": "library", "name": "jq", "version": "1.6"},
            {"type": "library", "name": "ca-certificates", "version": "20230311"},
            {"type": "application", "name": "ibmcloud-cli", "version": "2.22.0"}
          ]
        }
        SBOMEOF
        
        sed -i "s/TIMESTAMP_PLACEHOLDER/${TIMESTAMP}/g" /tmp/sbom.json
        sed -i "s/IMAGE_NAME_PLACEHOLDER/${IMAGE_NAME}/g" /tmp/sbom.json
        
        echo "==> SBOM generated:"
        cat /tmp/sbom.json
        
        printf 'SBOM generated with 4 components for %s' "${IMAGE_NAME}" > "$(results.sbom-summary.path)"
