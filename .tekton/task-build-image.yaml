apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build-image
spec:
  workspaces:
    - name: shared
      description: Shared workspace for writing sbom.json (consumed by store-sbom-to-cos)
  params:
    - name: image-name
      type: string
      description: The Packer image name produced by this run (with timestamp)
      default: ""
    - name: packer-plugin-b64
      type: string
      description: Base64-encoded packer-plugin-ibmcloud binary passed from deploy.sh
      default: ""
    - name: packer-hcl-b64
      type: string
      description: Base64-encoded ibmcloud.pkr.hcl content passed from deploy.sh
      default: ""
    - name: packer-key-b64
      type: string
      description: Base64-encoded SSH private key for packer VPC SSH auth
      default: ""
    - name: ibmcloud-api-key
      type: string
      description: IBM Cloud API key passed from the pipeline
      default: ""
  results:
    - name: image-name
      description: The Packer image name produced by this run
  steps:
    - name: install-packer-plugin
      image: alpine:3.19
      env:
        - name: STEP_PLUGIN_B64
          value: $(params.packer-plugin-b64)
      script: |
        #!/usr/bin/env sh
        set -eu
        apk add --no-cache coreutils > /dev/null
        BINARY="packer-plugin-ibmcloud_v3.6.0_x5.0_linux_amd64"
        PLUGIN_DIR="$(workspaces.shared.path)/packer-plugins/github.com/IBM/ibmcloud"
        mkdir -p "${PLUGIN_DIR}"
        echo "==> Writing packer-plugin-ibmcloud from payload..."
        printf '%s' "${STEP_PLUGIN_B64}" | base64 -d > "${PLUGIN_DIR}/${BINARY}"
        chmod +x "${PLUGIN_DIR}/${BINARY}"
        sha256sum "${PLUGIN_DIR}/${BINARY}" | awk '{print $1}' > "${PLUGIN_DIR}/${BINARY}_SHA256SUM"
        echo "==> Plugin ready at ${PLUGIN_DIR}/${BINARY}"

    - name: kickoff-packer-build
      image: hashicorp/packer:1.15.4
      env:
        - name: STEP_PKR_HCL_B64
          value: $(params.packer-hcl-b64)
        - name: STEP_PKR_KEY_B64
          value: $(params.packer-key-b64)
        - name: PKR_VAR_ibmcloud_api_key
          value: $(params.ibmcloud-api-key)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        export PACKER_LOG=1
        export PACKER_LOG_PATH=/dev/stdout
        # Point packer at the pre-downloaded plugin so it never calls GitHub
        export PACKER_PLUGIN_PATH="$(workspaces.shared.path)/packer-plugins"

        packer version

        # Decode SSH private key
        echo "==> Writing SSH private key..."
        printf '%s' "${STEP_PKR_KEY_B64}" | base64 -d > "$(workspaces.shared.path)/packer_id_rsa"
        chmod 600 "$(workspaces.shared.path)/packer_id_rsa"

        # Decode and write the generated HCL file
        echo "==> Writing ibmcloud.pkr.hcl..."
        printf '%s' "${STEP_PKR_HCL_B64}" | base64 -d > "$(workspaces.shared.path)/ibmcloud.pkr.hcl"
        echo "--- ibmcloud.pkr.hcl ---"
        cat "$(workspaces.shared.path)/ibmcloud.pkr.hcl"
        echo "------------------------"
        echo "==> Plugins available:"
        packer plugins installed
        packer validate "$(workspaces.shared.path)/ibmcloud.pkr.hcl"

        packer build "$(workspaces.shared.path)/ibmcloud.pkr.hcl"

        echo "==> SBOM (CycloneDX JSON):"
        if [[ -f "$(workspaces.shared.path)/sbom.json" ]]; then
          cat "$(workspaces.shared.path)/sbom.json"
        else
          echo "WARNING: sbom.json not found in shared workspace — syft may not have run or file provisioner failed"
        fi

        printf '%s' "$(params.image-name)" > "$(results.image-name.path)"
