# Tekton pipeline triggers definition — IBM Cloud reads this file from the repository.
# Docs: https://cloud.ibm.com/docs/ContinuousDelivery?topic=ContinuousDelivery-tekton-pipelines
---
# The EventListener is required as the named entry-point for the manual trigger.
apiVersion: tekton.dev/v1beta1
kind: EventListener
metadata:
  name: pipeline-image-builder-listener
spec:
  triggers:
    - name: manual-trigger
      bindings:
        - ref: pipeline-image-builder-binding
      template:
        ref: pipeline-image-builder-template
---
apiVersion: tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: pipeline-image-builder-binding
spec:
  params:
    - name: image-name
      value: $(body.image-name)
    - name: cos-bucket
      value: $(body.cos-bucket)
    - name: cos-region
      value: $(body.cos-region)
    - name: cos-instance-crn
      value: $(body.cos-instance-crn)
    - name: ibmcloud-api-endpoint
      value: $(body.ibmcloud-api-endpoint)
    - name: cos-api-endpoint
      value: $(body.cos-api-endpoint)
    - name: packer-hcl-cos-url
      value: $(body.packer-hcl-cos-url)
    - name: packer-key-b64
      value: $(body.packer-key-b64)
    - name: packer-plugin-cos-url
      value: $(body.packer-plugin-cos-url)
---
apiVersion: tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: pipeline-image-builder-template
spec:
  params:
    - name: ibmcloud-api-key
      description: IBM Cloud API key sourced from the pipeline environment property
      default: $(params.env.ibmcloud-api-key)
    - name: image-name
      description: Packer image name (with timestamp) from deploy.sh
      default: ""
    - name: cos-bucket
      description: COS bucket to store the run summary
      default: ""
    - name: cos-region
      description: COS region
      default: "us-south"
    - name: cos-instance-crn
      description: CRN of the COS service instance
      default: ""
    - name: ibmcloud-api-endpoint
      description: IBM Cloud API endpoint (https://test.cloud.ibm.com for staging)
      default: "https://cloud.ibm.com"
    - name: cos-api-endpoint
      description: COS service endpoint (empty for production; set for staging)
      default: ""
    - name: packer-hcl-cos-url
      description: COS URL of the base64-encoded ibmcloud.pkr.hcl
      default: ""
    - name: packer-key-b64
      description: Base64-encoded SSH private key for packer VPC SSH auth
      default: ""
    - name: packer-plugin-cos-url
      description: COS URL to download the packer-plugin-ibmcloud binary
      default: ""
  resourcetemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: pipeline-image-builder-pvc-$(tt.params.image-name)
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 100Mi
    - apiVersion: tekton.dev/v1beta1
      kind: PipelineRun
      metadata:
        generateName: pipeline-image-builder-run-
      spec:
        pipelineRef:
          name: pipeline-image-builder
        workspaces:
          - name: shared
            persistentVolumeClaim:
              claimName: pipeline-image-builder-pvc-$(tt.params.image-name)
        params:
          - name: ibmcloud-api-key
            value: $(tt.params.ibmcloud-api-key)
          - name: image-name
            value: $(tt.params.image-name)
          - name: cos-bucket
            value: $(tt.params.cos-bucket)
          - name: cos-region
            value: $(tt.params.cos-region)
          - name: cos-instance-crn
            value: $(tt.params.cos-instance-crn)
          - name: ibmcloud-api-endpoint
            value: $(tt.params.ibmcloud-api-endpoint)
          - name: cos-api-endpoint
            value: $(tt.params.cos-api-endpoint)
          - name: packer-hcl-cos-url
            value: $(tt.params.packer-hcl-cos-url)
          - name: packer-key-b64
            value: $(tt.params.packer-key-b64)
          - name: packer-plugin-cos-url
            value: $(tt.params.packer-plugin-cos-url)
